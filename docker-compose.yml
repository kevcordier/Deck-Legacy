services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deck
      POSTGRES_PASSWORD: deck
      POSTGRES_DB: deck_legacy
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U deck -d deck_legacy']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
