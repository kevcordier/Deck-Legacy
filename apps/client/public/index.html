<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Deck Legacy</title>
    <!-- Without this link the browser asks for /favicon.ico at the domain root, outside the /Deck-Legacy base path. -->
    <link rel="icon" href="/Deck-Legacy/favicon.ico" />
    <!-- Home screen install: iOS reads the apple-* tags (not the manifest icons), Android the manifest.
         black-translucent + viewport-fit=cover: the page fills the whole screen and SafeAreaView pads the
         notch and home indicator from env(safe-area-inset-*). -->
    <link rel="manifest" href="/Deck-Legacy/manifest.json" />
    <link rel="apple-touch-icon" href="/Deck-Legacy/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Deck Legacy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#f0e4be" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
