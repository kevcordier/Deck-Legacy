name: Code quality checks and tests

on:
  workflow_call:

jobs:
  ci:
    name: CI
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7
      - name: 🏗️ Install pnpm
        uses: pnpm/action-setup@v6 # version read from package.json "packageManager"
      - name: ⚙️ Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile
      # Type-aware lint rules need the generated (gitignored) Prisma client.
      - name: 🧬 Generate Prisma client
        run: pnpm --filter @deck-legacy/server prisma:generate
      - name: 📝 Lint
        run: pnpm lint
      - name: 🔍 Typecheck
        run: pnpm typecheck
      - name: 🎨 Format check
        run: pnpm format:check
      - name: 🧭 Architecture rules
        run: pnpm depcruise
      - name: 🧪 Tests
        run: pnpm test:coverage
      - name: 📦 Build server
        run: pnpm build:server
      - name: 📊 Report engine coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@3c50566c523e04813df28de8f7c48dd97d663f1c
        with:
          name: engine
          working-directory: packages/engine
      - name: 📊 Report server coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@3c50566c523e04813df28de8f7c48dd97d663f1c
        with:
          name: server
          working-directory: apps/server
